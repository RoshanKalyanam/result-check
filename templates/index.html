<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Result Check</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; }
        h1 { color: #2c3e50; text-align: center; }
        form { text-align: center; margin: 30px 0; }
        input[type="text"] { padding: 10px; font-size: 16px; width: 200px; border: 2px solid #3498db; border-radius: 5px; }
        button { padding: 10px 20px; font-size: 16px; background: #3498db; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #2980b9; }
        .error { color: #e74c3c; text-align: center; margin: 15px 0; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Student Result Check</h1>
    <form method="POST" action="/result">
        <input type="text" name="roll_number" placeholder="Enter Roll Number" required>
        <button type="submit">Check Result</button>
    </form>
    {% if error %}
    <p class="error">{{ error }}</p>
    {% endif %}
</body>
</html>
